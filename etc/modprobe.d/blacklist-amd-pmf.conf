# AMD Platform Management Framework: on kernel 6.8 with BIOS F.15 it takes over the power profile
# and applies settings from the BIOS that make the laptop drop to ~1 GHz / 8 W under heavy
# all-core load. It provides nothing else here ("No Smart PC policy present").
# See docs/2026-10-07-all-core-collapse.md.
blacklist amd_pmf
