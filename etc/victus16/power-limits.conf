# Power limits applied by victus16-power-apply (ryzenadj), per power source.
# Installed to /etc/victus16/power-limits.conf; edit there, then:
#   sudo systemctl restart victus16-power.service
#
# Barrel charger: what Windows uses on it (HWiNFO, Cinebench R23 multi-core, 2026-10-07): about
# 60 W package power, Tctl 95-99 C. Without these Linux stays at the processor's default 45 W.
#
# Battery or a USB-C charger/dock: 45 W, the processor's default. The firmware alone would set
# about 25 W on battery (as Windows runs); 45 W is faster but drains the battery sooner. Leave
# OTHER_STAPM_LIMIT empty to keep the firmware's limits there instead.
#
# With the barrel and a USB-C source both connected, the "other" limits apply.

# Barrel charger, mW / degrees C
BARREL_STAPM_LIMIT=60000  # sustained (STAPM)
BARREL_SLOW_LIMIT=60000   # average (PPT SLOW)
BARREL_FAST_LIMIT=65000   # short bursts (PPT FAST)
BARREL_TCTL_TEMP=95       # temperature limit; the processor's own maximum is 100

# Battery and USB-C, mW / degrees C
OTHER_STAPM_LIMIT=45000
OTHER_SLOW_LIMIT=45000
OTHER_FAST_LIMIT=45000
OTHER_TCTL_TEMP=95
